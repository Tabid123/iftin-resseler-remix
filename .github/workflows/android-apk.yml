name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [release, debug]
        default: release

jobs:
  build-release:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == ''))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore (optional secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
            echo "Using keystore from secrets"
          else
            echo "Using repo keystore"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p ../artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../artifacts/ \;
          ls -la ../artifacts

      - name: Upload Release APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: iftin-delivery-release-apk
          path: artifacts/*.apk
          retention-days: 3
          compression-level: 0
          overwrite: true
          if-no-files-found: error

      - name: Upload Release APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  build-debug:
    if: |
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p ../artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../artifacts/ \;
          ls -la ../artifacts

      - name: Upload Debug APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: iftin-delivery-debug-apk
          path: artifacts/*.apk
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error

      # Fallback: artifact storage quota can be full, releases don't use that quota
      - name: Publish Debug APK to rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug APK (latest)
          prerelease: true
          files: artifacts/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
